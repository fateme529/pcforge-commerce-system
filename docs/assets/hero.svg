<svg width="1200" height="380" viewBox="0 0 1200 380" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">PCForge Commerce System</title>
  <desc id="desc">Animated project banner for an end-to-end PC parts commerce, compatibility, and database automation system.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" stroke="#815799" stroke-opacity=".06"/></pattern>
    <filter id="glow" x="-150%" y="-150%" width="400%" height="400%"><feGaussianBlur stdDeviation="4" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="frame"><rect width="1200" height="380" rx="28"/></clipPath>
  </defs>
  <style>
    .eyebrow{font:800 13px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:3px}.title{font:850 64px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:-2px}.subtitle{font:650 24px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.body{font:500 16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.metric{font:800 20px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.label{font:700 10px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:1px}.micro{font:800 10px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:1.5px}
    .intro{animation:reveal 1.1s cubic-bezier(.2,.8,.2,1) both}.rule{stroke-dasharray:430;stroke-dashoffset:430;animation:draw 1.5s .45s ease-out forwards}.stack{animation:float 5s ease-in-out infinite}.packet{filter:url(#glow)}.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 3.2s ease-in-out infinite}.blink{animation:blink 2.7s ease-in-out infinite}.late{animation-delay:-1.3s}
    @keyframes reveal{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}@keyframes draw{to{stroke-dashoffset:0}}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}@keyframes pulse{0%,100%{opacity:.5;transform:scale(.88)}50%{opacity:1;transform:scale(1.12)}}@keyframes blink{0%,100%{opacity:.25}50%{opacity:1}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}.intro{opacity:1!important}}
  </style>
  <g clip-path="url(#frame)">
    <rect width="1200" height="380" fill="#F8F4FA"/><rect width="1200" height="380" fill="url(#grid)"/>
    <circle cx="1115" cy="58" r="210" fill="#E9DDF0"/><circle cx="1078" cy="356" r="190" fill="#F0E7F4"/>
    <g class="intro">
      <text x="68" y="68" class="eyebrow" fill="#815799">DATABASE ENGINEERING · DESKTOP APPLICATION</text>
      <text x="66" y="145" class="title" fill="#2A1925">PCFORGE</text>
      <text x="68" y="188" class="subtitle" fill="#512A46">PC Parts Commerce &amp; Compatibility System</text>
      <text x="68" y="224" class="body" fill="#6B5865">Domain analysis, relational design, database automation,</text><text x="68" y="248" class="body" fill="#6B5865">and a connected C# WinForms client.</text>
      <path class="rule" d="M68 270H498" stroke="#815799" stroke-width="2" stroke-linecap="round"/>
    </g>
    <g transform="translate(68 294)"><rect width="122" height="54" rx="14" fill="#FFFDFB" stroke="#D8C6E3"/><text x="18" y="25" class="metric" fill="#512A46">34</text><text x="18" y="42" class="label" fill="#815799">TABLES</text></g>
    <g transform="translate(202 294)"><rect width="122" height="54" rx="14" fill="#F0E7F4" stroke="#C8ADD6"/><text x="18" y="25" class="metric" fill="#512A46">47</text><text x="18" y="42" class="label" fill="#815799">TRIGGERS</text></g>
    <g transform="translate(336 294)"><rect width="122" height="54" rx="14" fill="#E9DDF0" stroke="#B99AC8"/><text x="18" y="25" class="metric" fill="#512A46">10</text><text x="18" y="42" class="label" fill="#815799">SQL JOBS</text></g>
    <g transform="translate(470 294)"><rect width="122" height="54" rx="14" fill="#512A46" stroke="#512A46"/><text x="18" y="25" class="metric" fill="#FFFDFB">9</text><text x="18" y="42" class="label" fill="#E9DDF0">UI SURFACES</text></g>

    <g class="stack">
      <rect x="760" y="61" width="306" height="258" rx="28" fill="#FFFDFB" stroke="#D8C6E3" stroke-width="2"/>
      <text x="790" y="92" class="micro" fill="#815799">SYSTEM FLOW</text>
      <rect x="790" y="112" width="246" height="50" rx="13" fill="#F0E7F4" stroke="#C8ADD6"/><circle cx="815" cy="137" r="7" fill="#B99AC8" class="pulse"/><text x="836" y="142" class="body" fill="#512A46">WinForms experience</text>
      <rect x="790" y="184" width="246" height="50" rx="13" fill="#E9DDF0" stroke="#B99AC8"/><circle cx="815" cy="209" r="7" fill="#815799" class="pulse late"/><text x="836" y="214" class="body" fill="#512A46">Entity Framework 6</text>
      <rect x="790" y="256" width="246" height="38" rx="13" fill="#512A46" stroke="#512A46"/><circle cx="815" cy="275" r="6" fill="#E9DDF0" class="blink"/><text x="836" y="280" class="body" fill="#FFFDFB">SQL Server automation</text>
      <path d="M913 162V184M913 234V256" stroke="#815799" stroke-width="2" stroke-dasharray="4 6"/>
      <circle class="packet" r="4" fill="#815799"><animateMotion path="M913 162V256" dur="3.6s" repeatCount="indefinite"/></circle>
    </g>
    <circle cx="1113" cy="115" r="3" fill="#815799" class="blink"/><circle cx="717" cy="285" r="3" fill="#B99AC8" class="blink late"/>
    <text x="1148" y="348" text-anchor="end" class="micro" fill="#815799">FROM REQUIREMENTS TO WORKING SOFTWARE</text>
  </g>
  <rect x="1" y="1" width="1198" height="378" rx="27" stroke="#D8C6E3" stroke-width="2"/>
</svg>
