<svg width="1200" height="420" viewBox="0 0 1200 420" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">PCForge system overview</title>
  <desc id="desc">The WinForms interface connects through Entity Framework to SQL Server, where relational data, views, triggers, and scheduled jobs implement commerce and PC compatibility rules.</desc>
  <defs>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" stroke="#815799" stroke-opacity=".045"/></pattern>
    <filter id="glow" x="-140%" y="-140%" width="380%" height="380%"><feGaussianBlur stdDeviation="3.5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#815799"/></marker>
  </defs>
  <style>
    .eyebrow{font:800 12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:2px}.name{font:750 18px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.sub{font:500 12px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.chip{font:750 11px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.7px}.flow{stroke-dasharray:7 9;animation:dash 16s linear infinite}.card{transform-box:fill-box;transform-origin:center;animation:breathe 6s ease-in-out infinite}.middle{animation-delay:-2s}.last{animation-delay:-4s}.pulse{animation:pulse 2.8s ease-in-out infinite}.late{animation-delay:-1.4s}
    @keyframes dash{to{stroke-dashoffset:-160}}@keyframes breathe{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
  <rect x=".5" y=".5" width="1199" height="419" rx="26" fill="#F8F4FA" stroke="#D8C6E3"/><rect x="1" y="1" width="1198" height="418" rx="25" fill="url(#grid)"/>
  <text x="44" y="42" class="eyebrow" fill="#815799">HOW THE SYSTEM FITS TOGETHER</text><text x="1156" y="42" text-anchor="end" class="eyebrow" fill="#6B5865">DATABASE-FIRST DESKTOP ARCHITECTURE</text>
  <path class="flow" d="M280 162H456M744 162H920" stroke="#815799" stroke-width="2" marker-end="url(#arrow)"/>
  <circle r="5" fill="#512A46" filter="url(#glow)"><animateMotion path="M280 162H920" dur="6.5s" repeatCount="indefinite"/></circle>
  <g class="card"><rect x="44" y="82" width="236" height="160" rx="20" fill="#FFFDFB" stroke="#D8C6E3" stroke-width="1.5"/><circle cx="79" cy="119" r="18" fill="#F0E7F4" stroke="#B99AC8"/><rect x="69" y="112" width="20" height="14" rx="2" stroke="#815799"/><text x="109" y="116" class="eyebrow" fill="#815799">PRESENTATION</text><text x="68" y="164" class="name" fill="#2A1925">C# WinForms client</text><text x="68" y="190" class="sub" fill="#6B5865">Login, profile, carts, discounts,</text><text x="68" y="208" class="sub" fill="#6B5865">orders, VIP status, compatibility.</text></g>
  <g class="card middle"><rect x="456" y="82" width="288" height="160" rx="20" fill="#E9DDF0" stroke="#B99AC8" stroke-width="1.5"/><circle cx="491" cy="119" r="18" fill="#D8C6E3" stroke="#815799"/><path d="M482 119H500M491 110V128" stroke="#815799" stroke-width="2" stroke-linecap="round"/><text x="521" y="116" class="eyebrow" fill="#6B3E5F">DATA ACCESS</text><text x="480" y="164" class="name" fill="#2A1925">Entity Framework 6</text><text x="480" y="190" class="sub" fill="#6B5865">Database-first EDMX models connect</text><text x="480" y="208" class="sub" fill="#6B5865">forms to entities and reporting views.</text></g>
  <g class="card last"><rect x="920" y="82" width="236" height="160" rx="20" fill="#512A46" stroke="#815799" stroke-width="1.5"/><circle cx="955" cy="119" r="18" fill="#815799" stroke="#B99AC8"/><path d="M946 114C946 109 964 109 964 114V126C964 131 946 131 946 126V114ZM946 114C946 119 964 119 964 114M946 120C946 125 964 125 964 120" stroke="#FFFDFB"/><text x="985" y="116" class="eyebrow" fill="#E9DDF0">DATABASE</text><text x="944" y="164" class="name" fill="#FFFDFB">SQL Server</text><text x="944" y="190" class="sub" fill="#E9DDF0">Tables, constraints, views, triggers,</text><text x="944" y="208" class="sub" fill="#E9DDF0">and scheduled jobs enforce behavior.</text></g>
  <g transform="translate(44 285)"><rect width="258" height="82" rx="17" fill="#FFFDFB" stroke="#D8C6E3"/><circle cx="28" cy="28" r="5" fill="#815799" class="pulse"/><text x="46" y="33" class="chip" fill="#512A46">COMPATIBILITY ENGINE</text><text x="24" y="59" class="sub" fill="#6B5865">CPU, board, RAM, GPU, PSU, case, storage</text></g>
  <g transform="translate(328 285)"><rect width="258" height="82" rx="17" fill="#F0E7F4" stroke="#C8ADD6"/><circle cx="28" cy="28" r="5" fill="#815799" class="pulse late"/><text x="46" y="33" class="chip" fill="#512A46">COMMERCE RULES</text><text x="24" y="59" class="sub" fill="#6B5865">Inventory, carts, checkout, timeouts</text></g>
  <g transform="translate(612 285)"><rect width="258" height="82" rx="17" fill="#E9DDF0" stroke="#B99AC8"/><circle cx="28" cy="28" r="5" fill="#815799" class="pulse"/><text x="46" y="33" class="chip" fill="#512A46">CUSTOMER VALUE</text><text x="24" y="59" class="sub" fill="#6B5865">Wallet, referrals, discounts, VIP cashback</text></g>
  <g transform="translate(896 285)"><rect width="260" height="82" rx="17" fill="#512A46" stroke="#815799"/><circle cx="28" cy="28" r="5" fill="#E9DDF0" class="pulse late"/><text x="46" y="33" class="chip" fill="#FFFDFB">DATABASE AUTOMATION</text><text x="24" y="59" class="sub" fill="#E9DDF0">47 triggers, 10 jobs, 4 reporting views</text></g>
</svg>
